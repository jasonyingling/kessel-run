:root{--bg:#0b1020;--paper:#141d32;--ink:#e7edff;--muted:#93a3c3;--line:#293550;--green:#638dff;--light:#202e50;--lime:#d4e2ff;--purple:#302747;--orange:#352d35}*{box-sizing:border-box}body{margin:0;font:14px 'DM Sans',sans-serif;color:var(--ink);background:var(--bg);color-scheme:dark}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #93b5ff;outline-offset:3px}button{border:0;background:none}a{color:var(--green)}h1,h2,h3,h4,p{margin:0}h1,h2,h3{font-family:Manrope,sans-serif}h1{font-size:30px;letter-spacing:-1.2px;line-height:1.25}h2{font-size:21px;letter-spacing:-.6px}h3{font-size:16px;letter-spacing:-.3px}p{line-height:1.65}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:12px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.stack{display:grid;gap:16px}.btn{padding:11px 17px;border-radius:9px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:1px solid var(--line)}.btn:hover{filter:brightness(.97)}.btn.primary{background:#416ce0;color:white;border-color:var(--green)}.btn.soft{background:var(--light);color:var(--green);border-color:transparent}.btn.dark{background:#3558ae;color:white;border-color:var(--ink)}.textbtn{font-size:12px;color:var(--green);font-weight:600;padding:8px 0}.icon{width:18px;height:18px;display:inline-block;vertical-align:middle;flex:none}.sidebar{width:226px;background:var(--paper);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;padding:29px 18px 16px;display:flex;flex-direction:column;z-index:4}.brand{font:800 21px Manrope,sans-serif;letter-spacing:-1px;gap:9px;padding:0 12px 32px}.brandmark{width:29px;height:30px;background:transparent;color:var(--lime);border-radius:8px;display:grid;place-items:center;font-s :12px;color:var(--muted);margin-top:5px}.publication .row.bottom{margin-top:25px;gap:7px;font-size:11px}.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:5px;font-size:10px;line-height:1.2;font-weight:600;background:#222e46;color:#aab8d2}.tag.green{background:var(--light);color:var(--green)}.tag.purple{background:var(--purple);color:#c6b2f1}.tag.orange{background:var(--orange);color:#dfbc94}.tag.blue{background:#1a3449;color:#a4d8f1}.sectionhead{margin:31px 0 17px;display:flex;align-items:center;justify-content:space-between}.sectionhead h2{font-size:18px}.spotlight{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;background:#172542;border:1px solid #2d4269;border-radius:12px;margin-top:25px;padding:21px 24px}.spotlight h3{font-size:15px;margin-bottom:5px}.spotlight p{font-size:12px;color:#a1b1cf}.tabs{display:flex;gap:23px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab{padding:13px 0 14px;color:var(--muted);font-size:12px;position:relative}.tab.active{color:var(--green);font-weight:650}.tab.active:after{content:'';height:2px;background:var(--green);position:absolute;bottom:-1px;left:0;right:0}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.column{background:#101a2d;border-radius:10px;padding:13px;min-height:243px}.column-head{font-size:11px;font-weight:650;margin:2px 0 15px}.column-head span{color:#8799ba;margin-left:6px}.piece{display:block;width:100%;padding:15px;background:var(--paper);border:1px solid #2a3855;border-radius:9px;text-align:left;margin-bottom:10px;box-shadow:0 2px 2px #00000018}.piece:hover{transform:translateY(-2px);border-color:#6185bf}.piece .eyebrow{font-size:8px;letter-spacing:.6px}.piece h4{font-size:13px;line-height:1.5;margin:11px 0 16px;font-weight:600}.piece-footer{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}.empty-note{font-size:11px;color:#8294b7;text-align:center;padding:28px 4px;line-height:1.7}.add-piece{width:100%;padding:8px;color:#92a6c8;font-size:11px}.bottom-note{font-size:10px;color:#8193b5;padding-top:23px;display:flex;justify-content:space-between}.two-col>.panel .board{grid-template-columns:repeat(2,1fr)}.two-col>div>.board{grid-template-columns:repeat(2,1fr)}.two-col{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:25px}.rule{padding:18px 0;border-bottom:1px solid var(--line)}.rule:last-child{border:0}.rule h4{font-size:13px;margin-bottom:7px}.rule p{font-size:12px;color:var(--muted)}.rule .tag{margin-top:10px}.letter{font-family:Georgia,serif;font-size:18px;line-height:1.9;color:#c9d5ee}.letter p{margin-bottom:21px}.letter h2{font-family:Georgia,serif;font-size:30px;line-height:1.3;margin-bottom:24px;font-weight:400}.editor{width:100%;min-height:390px;resize:vertical;border:0;background:transparent;outline:none;font:17px/1.95 Georgia,serif;color:#c9d5ee}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:12px;font-weight:600}input,textarea,select{border:1px solid #344665;background:var(--paper);border-radius:8px;padding:12px;color:var(--ink);width:100%;outline-color:#8bb0ff}textarea{min-height:105px;resize:vertical}.choice{border:1px solid var(--line);border-radius:10px;text-align:left;padding:17px;flex:1;background:var(--paper)}.choice.selected{border-color:var(--green);background:#203357}.choice b{font-size:13px;display:block}.choice p{font-size:11px;color:var(--muted);margin-top:7px}.note{background:#1c2943;border-radius:8px;padding:14px;font-size:12px;line-height:1.7;color:#a5b4d1}.step-list{display:flex;gap:8px;font-size:11px;color:var(--muted);margin:22px 0}.step-list span{padding:7px 12px;border-radius:6px;background:#1d2b46}.step-list .on{background:var(--green);color:white}.metric{font-size:29px;font-family:Manrope;margin:17px 0 3px}.checkline{display:flex;gap:10px;margin:17px 0;font-size:12px;line-height:1.6}.check{color:var(--green)}.output{display:flex;align-items:center;gap:18px;padding:21px 0;border-bottom:1px solid var(--line)}.output:last-child{border:0}.output div.grow{flex:1}.output h3{font-size:14px;margin-bottom:6px}.output p{font-size:11px;color:var(--muted)}.output-icon{border-radius:10px;background:#202e4b;width:43px;height:43px;display:grid;place-items:center}.dialog-backdrop{position:fixed;inset:0;background:#020612b8;z-index:20;display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}dialog{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:0 22px 100px #00000055;width:590px;max-width:100%;max-height:90vh;overflow:auto;padding:30px;color:var(--ink);position:relative;margin:0}.close{width:28px;height:28px;border-radius:50%;background:#22314f;font-size:18px}.dialog-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:23px;padding-top:21px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:13px 22px;border-radius:9px;z-index:40;box-shadow:0 4px 15px #0002;font-size:12px}.interview-answer{margin-top:15px;padding:15px;background:var(--light);border-radius:8px;font-size:12px}.source-row{padding:15px 0;border-bottom:1px solid var(--line);font-size:12px}.source-row p{color:var(--muted);font-size:11px;margin-top:6px}.progress{height:5px;background:#293957;border-radius:4px;overflow:hidden;margin:17px 0}.progress span{height:100%;display:block;background:#7ba2ff;width:30%}.mob-brand{display:none}.subtle-link{color:var(--muted);font-size:11px;padding:5px}.notice{border:1px solid #4c4350;background:#292637;color:#d1b99e;padding:13px;border-radius:9px;font-size:11px;line-height:1.65;margin-bottom:20px}button:disabled{opacity:.5;cursor:default}.dot{width:6px;height:6px;background:currentColor;border-radius:50%} .keyboard{font-size:9px;border:1px solid #364663;border-radius:3px;padding:2px 4px;color:#95a7c5}
@media(min-width:1600px){.page{padding-top:48px}.publication{min-height:230px}.column{min-height:300px}}
@media(max-width:1100px){.sidebar{width:190px;padding-left:10px;padding-right:10px}main{margin-left:190px}.page{padding:26px 24px}.topbar{padding:0 24px}.board{grid-template-columns:repeat(2,1fr)}.cards{gap:10px}.card{padding:17px}.two-col{grid-template-columns:minmax(0,1fr) 255px}.publication h3{font-size:14px}.brand{font-size:19px}}
@media(max-width:760px){.sidebar{position:relative;width:100%;padding:12px;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.sidebar .brand{padding:0 15px 0 0;font-size:16px}.sidebar .workspace,.sidebar .side-label,.sidebar .pubnav,.sidebar footer{display:none}.sidebar nav{display:flex;flex:1}.sidebar .nav{width:auto;font-size:11px;padding:9px;gap:5px}.sidebar .nav .count,.sidebar .nav .icon{display:none}main{margin:0}.topbar{height:54px;padding:0 18px}.topbar .demo{display:none}.page{padding:25px 18px}h1{font-size:26px}.pagehead{gap:12px;align-items:flex-start}.cards{grid-template-columns:1fr}.publication{min-height:0;padding:17px 20px}.publication h3{margin-top:10px}.publication .row.bottom{margin-top:13px}.spotlight{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.board{gap:9px}.column{padding:9px}.piece{padding:11px}.pagehead .btn{white-space:nowrap;padding:10px}.output{flex-wrap:wrap}.bottom-note span:last-child{display:none}.tabs{gap:18px}.letter h2{font-size:25px}.panel{padding:20px}.row.wrap{flex-wrap:wrap}.mob-brand{display:block}}

<body>
<aside class="sidebar" id="sidebar"></aside><main><header class="topbar"><div class="crumb" id="crumb"></div><div class="row"><span class="demo">Interactive concept · sample content</span><button class="subtle-link" onclick="resetDemo()">Reset demo</button><div class="avatar" style="background:#243b60">J</div></div></header><div class="page" id="app"></div></main><div id="modal"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',pen:'<path d="m16 3 5 5-12 12-6 1 1-6Z M14 5l5 5"/>',voice:'<path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',file:'<path d="M14 3H5v18h14V8ZM14 3v5h5M8 12h8M8 16h6"/>',layers:'<path d="m12 3 10 5-10 5L2 8ZM2 12l10 5 10-5M2 16l10 5 10-5"/>',book:'<path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.file}</svg>`;
const pubs=[{name:'Previously on Tech',short:'PT',color:'#8da3ff',bg:'#2b3157',description:'A little perspective on what comes next.',voice:'Established',version:'v3',rules:['Lead with what changes for the reader.','Be curious, without buying the hype.','Explain the tradeoff in plain language.']},{name:'View From The Pine',short:'VP',color:'#71b4da',bg:'#203951',description:'A seat on the bench. A point of view.',voice:'Developing',version:'v2',rules:['Have a point of view. Show your reasoning.','Write like a knowledgeable fan, not a press box.','Let humor follow the observation.']},{name:'The Greatest Ever Reviews',short:'GE',color:'#af92df',bg:'#362d50',description:'Find the things worth your time.',voice:'Starter',version:'v1',rules:['Make a clear recommendation, with a reason.','Be conversational and specific.','Separate personal experience from research.']}];
let state={page:'home',pub:1,tab:'draft',filter:'all',mode:'guided',wizard:1,voiceTab:'profile',interview:0,answers:[],approved:false,lesson:false,author:'Publication voice',pieces:[{title:'The case for the quiet offseason',pub:1,status:'Drafting',format:'Article',text:'A busy offseason is easy to sell. A quiet one asks a harder question: what if the best move is giving the plan time to work?\n\nThere is a difference between standing still and staying patient. One avoids a decision. The other is a decision, and it deserves the same scrutiny as a splashy signing.\n\nThe useful question isn’t whether a team won the offseason. It’s whether the roster makes more sense than it did before. That takes more than a transaction tracker to answer.'},{title:'What happens after the AI demo?',pub:0,status:'Review',format:'Newsletter',text:'The demo is the easy part. The interesting question is what happens when the tool meets an ordinary Tuesday.\n\nFor this piece, we’re looking beyond the launch announcement: where does the work actually get easier, and where does the effort move?'},{title:'A better way to choose your next read',pub:2,status:'Ideas',format:'Review',text:''},{title:'The tools we keep coming back to',pub:0,status:'Ready',format:'Article',text:'A useful tool earns its place by making an ordinary task a little easier. Here are the questions we come back to when deciding what deserves a permanent spot.'}],current:0,output:0,outputs:['Article','Newsletter','Social post'],outputStatus:['Drafting','Not started','Not started'],outputDrafts:{},customTitle:'',customNotes:''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(text,color='')=>`<span class="tag ${color}">${text}</span>`;
function toast(msg){document.getElementById('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
function go(page,pub){state.page=page;if(pub!==undefined)state.pub=pub;render();window.scrollTo(0,0)}
function sidebar(){document.getElementById('sidebar').innerHTML=`<div class="brand row"><span class="brandmark" aria-hidden="true"><svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="16" cy="16" r="5"/><ellipse cx="16" cy="16" rx="14" ry="7" transform="rotate(-25 16 16)"/></svg></span>kessel run<span style="color:#7eaaff">.</span></div><div class="workspace row"><span class="avatar" style="border-radius:7px;background:#233352">J</span><div><b class="small">My workspace</b><div class="tiny muted" style="margin-top:3px">Personal workspace</div></div></div><nav>${[['home','grid','Overview'],['library','layers','All content'],['voices','voice','Voice studio']].map(([p,i,t])=>`<button class="nav ${state.page===p?'active':''}" onclick="go('${p}')">${icon(i)}${t}${p==='library'?`<span class="count">${state.pieces.length}</span>`:''}</button>`).join('')}</nav><div class="eyebrow side-label">Your publications</div><div class="pubnav">${pubs.map((p,i)=>`<button class="nav ${state.page==='publication'&&state.pub===i?'active':''}" onclick="go('publication',${i})"><span class="pub-dot" style="background:${p.color}"></span><span style="font-size:11px">${p.name}</span></button>`).join('')}</div><footer><div class="side-tip"><div class="row small"><span style="color:var(--green)">${icon('book')}</span><b>Your voice. Everywhere.</b></div><p>One publication voice, thoughtfully adapted to every format.</p><button class="textbtn" onclick="go('voices')">Explore your voices</button></div><div class="profile-user row"><div class="avatar">J</div><div><b class="small">Your editorial desk</b><div class="tiny muted">Kessel Run concept</div></div></div></footer>`}
function publicationCards(){return `<div class="cards">${pubs.map((p,i)=>`<button class="card publication clickable" style="--color:${p.color}" onclick="go('publication',${i})"><div class="row between"><div class="publogo" style="background:${p.bg}">${p.short}</div></div><h3>${p.name}</h3><p>${p.description}</p><div class="row bottom">${badge(p.voice+' voice',i===2?'orange':'green')}<span class="muted" style="margin-left:auto">${state.pieces.filter(x=>x.pub===i).length} ${state.pieces.filter(x=>x.pub===i).length===1?'piece':'pieces'}</span></div></button>`).join('')}</div>`}
function board(onlyPub){let list=state.pieces.map((p,i)=>({...p,id:i})).filter(p=>(onlyPub===undefined||p.pub===onlyPub)&&(state.filter!=='review'||p.status==='Review'));return `<div class="board">${['Ideas','Drafting','Review','Ready'].map((stage,i)=>`<div class="column"><div class="row between column-head"><div><span class="pub-dot" style="display:inline-block;background:${['#879ac0','#729eef','#ae95db','#83c0d3'][i]};margin:0 6px 0 0"></span>${stage}<span>${list.filter(p=>p.status===stage).length}</span></div><span style="color:#8c9dbd">···</span></div>${list.filter(p=>p.status===stage).map(p=>`<button class="piece" onclick="openPiece(${p.id})"><div class="eyebrow" style="color:${['#adb9ef','#93c7e6','#c9b0ec'][p.pub]}">${pubs[p.pub].name}</div><h4>${esc(p.title)}</h4><div class="piece-footer"><span>${p.format}</span>${p.status==='Review'?badge('Your review','purple'):p.status==='Ready'?badge('Approved','green'):'<span></span>'}</div></button>`).join('')}${!list.some(p=>p.status===stage)?'<p class="empty-note">A little room for<br>what comes next.</p>':''}${stage==='Ideas'?'<button class="add-piece" onclick="newPiece()">+ Capture an idea</button>':''}</div>`).join('')}</div>`}
function home(){return `<div class="pagehead row between"><div><div class="eyebrow" style="margin-bottom:10px">Your editorial desk</div><h1>Good stories start here.</h1><p>Three publications. Three distinct voices. One place to bring them to life.</p></div><button class="btn primary" onclick="newPiece()">${icon('plus')} New piece</button></div>${publicationCards()}<div class="spotlight"><div class="row"><span class="publogo" style="background:#253d62;color:#9cbfff">${icon('voice')}</span><div><h3>A voice doesn’t need an archive to begin.</h3><p>Give The Greatest Ever Reviews its first few ground rules. We’ll build from there.</p></div></div><button class="btn" onclick="startInterview()">Shape your voice ${icon('arrow')}</button></div><div class="sectionhead"><div class="row"><h2>On your desk</h2>${badge(state.pieces.length+' pieces')}</div><button class="textbtn" onclick="go('library')">View all content</button></div>${board()}<div class="bottom-note"><span>Made for your point of view.</span><span>Demo data · changes last for this session</span></div>`}
function library(){return `<div class="pagehead row between"><div><h1>All content</h1><p>Your ideas, drafts, and finished work across every publication.</p></div><button class="btn primary" onclick="newPiece()">+ New piece</button></div><div class="tabs"><button class="tab ${state.filter==='all'?'active':''}" onclick="state.filter='all';render()">All pieces</button><button class="tab ${state.filter==='review'?'active':''}" onclick="state.filter='review';render()">Needs your review</button></div>${board()}`}
function publication(){let p=pubs[state.pub];return `<div class="pagehead row between"><div class="row"><div class="publogo" style="background:${p.bg};width:54px;height:54px">${p.short}</div><div><h1>${p.name}</h1><p>${p.description}</p></div></div><button class="btn primary" onclick="newPiece()">+ New piece</button></div><div class="two-col"><div><div class="sectionhead" style="margin-top:0"><h2>Publication desk</h2><button class="textbtn" onclick="go('voices',state.pub)">Manage voice</button></div>${board(state.pub)}</div><aside class="panel"><div class="eyebrow">Selected voice</div><h3 style="margin:15px 0 10px">${p.name}</h3>${badge(p.voice,'green')} <span class="tiny muted">${p.version} · publication default</span><div class="rule"><p>${p.rules[0]}</p></div><div class="rule"><p>${p.rules[1]}</p></div><button class="btn soft" style="width:100%;margin-top:15px" onclick="go('voices',state.pub)">${icon('voice')} Open voice studio</button><p class="tiny muted" style="margin-top:15px">Each output keeps the voice version it started with.</p></aside></div>`}
function voices(){let p=pubs[state.pub];return `<div class="pagehead row between"><div><div class="eyebrow" style="margin-bottom:10px">Voice studio</div><h1>Sound unmistakably like you.</h1><p>Define a publication’s voice. Give its writers room to be themselves.</p></div><button class="btn" onclick="exportVoice()">${icon('download')} Export profile</button></div><div class="tabs">${pubs.map((p,i)=>`<button class="tab ${i===state.pub?'active':''}" onclick="state.pub=${i};state.voiceTab='profile';render()">${p.name}</button>`).join('')}</div><div class="two-col"><div class="panel"><div class="row between"><div class="row"><div class="publogo" style="background:${p.bg}">${p.short}</div><div><h2>${p.name}</h2><div class="small muted" style="margin-top:5px">Publication voice · ${p.version}</div></div></div>${badge(p.voice,p.voice==='Starter'?'orange':'green')}</div><div class="tabs" style="margin-top:22px">${[['profile','Voice profile'],['authors','Authors'],['evidence','Evidence']].map(([t,l])=>`<button class="tab ${state.voiceTab===t?'active':''}" onclick="state.voiceTab='${t}';render()">${l}</button>`).join('')}</div>${state.voiceTab==='authors'?`<p class="small muted">Author profiles describe differences from this publication’s shared voice.</p>${state.pub===1?['Jason','David','Tim','Steve'].map(n=>`<div class="output"><div class="avatar">${n[0]}</div><div class="grow"><h3>${n}</h3><p>Sample author profile · inherits publication ${p.version}</p></div><button class="textbtn" onclick="authorDetail('${n}')">Review →</button></div>`).join(''):'<div class="note" style="margin-top:20px">No author profiles yet. The publication voice is enough to start writing.</div>'}`:state.voiceTab==='evidence'?`<div class="notice">Illustrative evidence only. No archive has been imported into this mockup.</div><div class="source-row"><b>${state.pub===2?'Your voice interview':'Writing samples'}</b><p>${state.pub===2?'Begin with your preferences. An archive can come later.':'A future import can use article URLs, uploaded documents, or pasted writing, with verified bylines.'}</p></div>${state.answers.map((a,i)=>`<div class="source-row"><b>Interview answer ${i+1}</b><p>${esc(a)}</p></div>`).join('')}<button class="btn soft" style="margin-top:20px" onclick="importSamples()">+ Add writing samples</button>`:`<p class="small muted">${state.pub===2?'A useful starting point, with room to grow. These are sample preferences to try.':'The shared foundation for every piece. These illustrative rules need your editorial validation.'}</p>${p.rules.map((r,i)=>`<div class="rule"><div class="row between"><h4>${r}</h4><span class="tiny muted">0${i+1}</span></div><p>${i>=3?'Confirmed by you in this demo session.':['Start with a concrete observation. Give the reader something to care about.','Choose natural language over stock phrases and sweeping claims.','Confidence should come from the material, never from invented experience.'][i%3]}</p>${badge(i>=3?'Confirmed preference':state.pub===2?'Starting preference':'Sample rule',i>=3?'green':'')}</div>`).join('')}<div class="note" style="margin-top:15px"><b>In practice</b><p style="font-family:Georgia;font-size:16px;margin-top:8px">“${state.pub===0?'A clever demo is one thing. A tool you still use on Friday is another.':state.pub===1?'The transaction tracker is quiet. That doesn’t mean there’s nothing to talk about.':'The best thing about this book isn’t the twist. It’s that you care who makes it to the end.'}”</p><span class="tiny">Illustrative calibration passage</span></div>`}</div><aside class="stack" style="align-content:start"><div class="panel"><div class="eyebrow">A voice in progress</div><h3 style="margin-top:14px">${state.pub===2?'Start small. Keep writing.':'Good voices keep evolving.'}</h3><p class="small muted" style="margin:12px 0 17px">Answer a few focused questions. Try the voice in a short passage. Keep what feels right.</p><button class="btn primary" style="width:100%" onclick="startInterview(state.pub)">${icon('voice')} ${state.answers.length?'Continue interview':'Refine with an interview'}</button><div class="checkline"><span class="check">✓</span><span>You review every proposed change.</span></div><div class="checkline"><span class="check">✓</span><span>Existing drafts keep their selected version.</span></div></div><div class="panel"><h3>Have an archive?</h3><p class="small muted" style="margin:12px 0">Bring writing from a website, documents, or pasted text. Learn a shared voice and author differences.</p><button class="textbtn" onclick="importSamples()">Add writing samples</button></div></aside></div>`}
function flow(){let p=state.pieces[state.current];if(!p.flow){let outputs=[p.format,'Newsletter','Social post'].filter((v,i,a)=>a.indexOf(v)===i);p.flow={outputs,outputStatus:outputs.map((_,i)=>i===0?p.status:'Not started'),versions:outputs.map(()=>pubs[p.pub].version),rules:outputs.map(()=>[...pubs[p.pub].rules]),authors:outputs.map(()=>'Publication voice')};}return p.flow}
Object.defineProperties(state,{outputs:{get(){return flow().outputs}},outputStatus:{get(){return flow().outputStatus}},author:{get(){return flow().authors[state.output]||'Publication voice'},set(v){flow().authors[state.output]=v}},answers:{get(){return pubs[state.pub].answers||(pubs[state.pub].answers=[])}}});
function openPiece(i){state.current=i;state.pub=state.pieces[i].pub;state.tab=state.pieces[i].status==='Ideas'?'brief':'draft';state.output=0;flow();go('piece')}
function editor(){let piece=state.pieces[state.current],p={...pubs[piece.pub],version:flow().versions[state.output],rules:flow().rules[state.output]},text=state.output===0?piece.text:(state.outputDrafts[state.current+'-'+state.output]||'');return `<div class="pagehead"><button class="textbtn" onclick="go('publication',state.pub)">← ${p.name}</button><div class="row between" style="margin-top:8px"><h1>${esc(piece.title)}</h1><button class="btn" onclick="exportPiece()">${icon('download')} Export</button></div><div class="row" style="margin-top:15px">${badge(state.outputStatus[state.output],state.outputStatus[state.output]==='Ready'?'green':'purple')}<span class="small muted">${p.name} · ${p.version} · ${esc(state.author)}</span></div></div><div class="tabs">${[['brief','Brief & sources'],['draft','Write & review'],['outputs','Outputs']].map(([t,l])=>`<button class="tab ${state.tab===t?'active':''}" onclick="state.tab='${t}';render()">${l}</button>`).join('')}</div>${state.tab==='outputs'?outputView():`<div class="two-col"><div class="panel">${state.tab==='brief'?`<h2>The starting point</h2><div class="field"><label for="angle">What’s the point of this piece?</label><textarea id="angle" oninput="state.pieces[state.current].notes=this.value">${esc(piece.notes||'Look past the obvious story. Give the reader a useful, well-supported way to think about the topic.')}</textarea></div><div class="field"><label for="notes">Source notes</label><textarea id="notes" oninput="state.pieces[state.current].sources=this.value" placeholder="Paste research, observations, links, or interview notes here.">${esc(piece.sources||'')}</textarea></div><div class="notice">The sample prose is an editorial sketch. Add real sources before using factual claims.</div><div class="row between"><button class="textbtn" onclick="contentInterview()">Talk through the idea instead</button><button class="btn primary" onclick="state.tab='draft';render()">Start writing ${icon('arrow')}</button></div>`:`<div class="row between" style="margin-bottom:22px"><select aria-label="Selected output" style="width:165px;font-size:12px" onchange="state.output=Number(this.value);render()">${state.outputs.map((o,i)=>`<option value="${i}" ${state.output===i?'selected':''}>${o}</option>`).join('')}</select><span class="tiny muted" id="save-status">Session draft</span></div><div class="letter"><h2>${esc(piece.title)}</h2></div><textarea class="editor" aria-label="Draft text" placeholder="Start writing here, or try the sample draft to explore the review flow." oninput="saveDraft(this.value)">${esc(text)}</textarea><div class="row between" style="border-top:1px solid var(--line);padding-top:18px"><span class="tiny muted">${text.trim()?text.trim().split(/\s+/).length:0} words · editable draft</span><button class="btn primary" onclick="reviewDraft()">Review this draft ${icon('arrow')}</button></div>`}</div><aside class="stack" style="align-content:start"><div class="panel"><div class="eyebrow">Writing companion</div><h3 style="margin-top:15px">${state.mode==='guided'?'One good section at a time.':'Get the whole idea down.'}</h3><p class="small muted" style="margin:10px 0 17px">${state.mode==='guided'?'Work through a section, make it yours, then move on.':'Start with a complete draft. Review the voice and evidence before approving.'}</p><div class="row" style="gap:5px"><button class="btn ${state.mode==='guided'?'soft':''}" onclick="state.mode='guided';render()">Guided</button><button class="btn ${state.mode==='fast'?'soft':''}" onclick="state.mode='fast';render()">Fast draft</button></div><button class="btn" style="width:100%;margin-top:13px" onclick="sampleDraft()">Try ${state.mode==='guided'?'a sample opening':'a sample draft'}</button><p class="tiny muted" style="margin-top:10px">Prototype interaction · no AI is connected.</p></div><div class="panel"><div class="row between"><h3>Voice for this output</h3>${icon('voice')}</div><p class="small muted" style="margin:13px 0">${p.name} · ${p.version}</p><div class="field"><label for="author">Author</label><select id="author" onchange="state.author=this.value"><option>Publication voice</option>${piece.pub===1?['Jason','David','Tim','Steve'].map(n=>`<option ${state.author===n?'selected':''}>${n}</option>`).join(''):''}</select></div><p class="small" style="line-height:1.8">${p.rules[0]}<br><span class="muted">${p.rules[1]}</span></p><button class="textbtn" style="margin-top:13px" onclick="go('voices',state.pub)">View full profile</button></div></aside></div>`}`}
function outputView(){return `<div class="panel"><div class="row between"><div><h2>One idea. A few good forms.</h2><p class="small muted" style="margin-top:8px">Each output has its own draft, voice selection, and approval.</p></div><button class="btn" onclick="addOutput()">+ Add output</button></div>${state.outputs.map((o,i)=>`<div class="output"><div class="output-icon">${icon(i===0?'file':i===1?'book':'pen')}</div><div class="grow"><h3>${o}</h3><p>${pubs[state.pub].name} · ${flow().versions[i]}</p></div>${badge(state.outputStatus[i],state.outputStatus[i]==='Ready'?'green':'')}<button class="btn" onclick="state.output=${i};state.tab='draft';render()">${state.outputStatus[i]==='Not started'?'Create draft':'Open draft'} →</button></div>`).join('')}<div class="note" style="margin-top:18px">Ready means approved for export. Scheduling, WordPress publishing, and connected channels are future integrations.</div></div>`}
function saveDraft(t){if(state.output===0)state.pieces[state.current].text=t;else state.outputDrafts[state.current+'-'+state.output]=t;state.outputStatus[state.output]='Drafting';if(state.output===0)state.pieces[state.current].status='Drafting';document.getElementById('save-status').textContent='Saved in this session'}
function sampleDraft(){const piece=state.pieces[state.current];const existing=state.output===0?piece.text:state.outputDrafts[state.current+'-'+state.output];if(existing&&existing.trim()){toast('Your draft is preserved. Edit it directly, or create another output.');return}let text=pubs[state.pub].rules[0]+'\n\n'+(state.pub===1?'A quiet offseason is harder to judge than a busy one. The useful question is whether the plan makes sense, not whether it makes a headline.':state.pub===0?'A clever demo is one thing. A tool you still use on Friday is another. What changes when the novelty wears off?':'A confident verdict starts with a clear reason. What does this get right, who will appreciate it, and what should they know before choosing?');if(state.mode==='fast')text+='\n\n[Add the specific evidence and observations that support your point.]\n\nThe conclusion should follow the evidence. Give the reader a next step, and be clear about what remains unknown.';saveDraft(text);render();toast('Sample copy added. This is not an AI-generated or verified draft.')}
function modal(body){document.getElementById('modal').innerHTML=`<div class="dialog-backdrop"><dialog open aria-modal="true" aria-label="Kessel Run workflow">${body}</dialog></div>`;setTimeout(()=>document.querySelector('dialog input,dialog textarea,dialog button')?.focus(),20)}
function closeModal(){document.getElementById('modal').innerHTML=''}
function titleRow(title){return `<div class="row between"><h2>${title}</h2><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div>`}
function newPiece(){state.wizard=1;state.customTitle='';state.customNotes='';state.customFormat='Article';wizard()}
function wizard(){modal(`${titleRow('A new piece of something good.')}<div class="step-list"><span class="${state.wizard===1?'on':''}">1 · The idea</span><span class="${state.wizard===2?'on':''}">2 · Voice & approach</span></div>${state.wizard===1?`<div class="field"><label for="pub">Publication</label><select id="pub" onchange="state.pub=Number(this.value)">${pubs.map((p,i)=>`<option value="${i}" ${state.pub===i?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="field"><label for="piece-title">Working title or idea</label><input id="piece-title" placeholder="What can’t you stop thinking about?" value="${esc(state.customTitle)}" oninput="state.customTitle=this.value"></div><div class="field"><label for="piece-notes">What do you have so far? <span class="muted">Optional</span></label><textarea id="piece-notes" placeholder="An angle, a few notes, or a question to explore…" oninput="state.customNotes=this.value">${esc(state.customNotes)}</textarea></div>`:`<div class="note row"><span class="publogo" style="background:${pubs[state.pub].bg}">${pubs[state.pub].short}</span><div><b>${pubs[state.pub].name}</b><div class="small">${pubs[state.pub].voice} profile · ${pubs[state.pub].version}</div></div></div><p class="small muted" style="margin:16px 0">A starter voice is enough. You can refine it as you write.</p><div class="field"><label for="format">First output</label><select id="format" onchange="state.customFormat=this.value">${['Article','Newsletter','Review','Social post'].map(f=>`<option ${state.customFormat===f?'selected':''}>${f}</option>`).join('')}</select></div><label class="small" style="display:block;margin:20px 0 9px;font-weight:600">How would you like to write?</label><div class="row"><button class="choice ${state.mode==='guided'?'selected':''}" onclick="state.mode='guided';wizard()"><b>Guided</b><p>Shape one section at a time.<br>Room to think and edit.</p></button><button class="choice ${state.mode==='fast'?'selected':''}" onclick="state.mode='fast';wizard()"><b>Fast draft</b><p>Get a full draft from your notes.<br>Then make it yours.</p></button></div>`}<div class="dialog-footer"><button class="textbtn" onclick="${state.wizard===1?'closeModal()':"state.wizard=1;wizard()"}">${state.wizard===1?'Cancel':'← Back'}</button><button class="btn primary" onclick="${state.wizard===1?'advanceWizard()':'createPiece()'}">${state.wizard===1?'Continue':'Open writing desk'} ${icon('arrow')}</button></div>`)}
function advanceWizard(){if(!state.customTitle.trim()){document.getElementById('piece-title').focus();toast('Give your idea a working title first.');return}state.wizard=2;wizard()}
function createPiece(){state.pieces.push({title:state.customTitle.trim(),pub:state.pub,status:'Ideas',format:document.getElementById('format').value,text:'',notes:state.customNotes});closeModal();openPiece(state.pieces.length-1);toast('Your new piece is ready to shape.')}
const questions=['What should a reader feel after reading this publication?','How opinionated should it be? What should it avoid?','Give me one phrase that sounds right, and one that doesn’t.'];
function startInterview(pub=2){state.pub=pub;state.interview=Math.min(state.answers.length,2);interview()}
function interview(){modal(`${titleRow('Let’s find the voice.')}<p class="small muted" style="margin-top:10px">${pubs[state.pub].name} · A few preferences are enough to begin.</p><div class="progress"><span style="width:${(state.interview+1)/3*100}%"></span></div><div class="eyebrow">Question ${state.interview+1} of 3</div><h3 style="font-size:20px;margin:17px 0">${questions[state.interview]}</h3><textarea id="answer" aria-label="Your voice preference" placeholder="There’s no right answer. Start with what feels natural.">${esc(state.answers[state.interview]||'')}</textarea><div class="note" style="margin-top:15px">This shapes the publication’s writing voice, not a transcription of how you speak.</div><div class="dialog-footer"><button class="textbtn" onclick="saveInterviewLater()">Save for later</button><button class="btn primary" onclick="answerInterview()">${state.interview===2?'Review preferences':'Next question'} →</button></div>`)}
function saveInterviewLater(){let a=document.getElementById('answer').value.trim();if(a)state.answers[state.interview]=a;closeModal();go('voices');toast('Interview saved for this session.')}
function answerInterview(){let val=document.getElementById('answer').value.trim();if(!val){toast('Add a preference, or save the interview for later.');return}state.answers[state.interview]=val;if(state.interview<2){state.interview++;interview()}else modal(`${titleRow('Your starting preferences')}<p class="small muted" style="margin-top:12px">Review the answers you want to keep with ${pubs[state.pub].name}. No rules have been inferred automatically.</p>${state.answers.slice(-3).map(a=>`<div class="interview-answer">${esc(a)}</div>`).join('')}<div class="dialog-footer"><button class="textbtn" onclick="closeModal()">Keep as draft</button><button class="btn primary" onclick="approveVoice()">Approve these preferences</button></div>`) }
function approveVoice(){pubs[state.pub].rules.push(...state.answers.slice(-3).filter(a=>!pubs[state.pub].rules.includes(a)));let p=pubs[state.pub];p.version='v'+(Number(p.version.slice(1))+1);state.voiceTab='profile';closeModal();go('voices');toast('Preferences approved for a new profile version. Maturity stays unchanged.')}
function importSamples(){modal(`${titleRow('Bring your existing voice.')}<p class="small muted" style="margin-top:12px">Use a website, documents, or pasted articles. Keep bylines attached so author voices stay distinct.</p><div class="field"><label for="site">Website or article URL</label><input id="site" type="url" value="${state.pub===1?'https://viewfromthepine.com':''}" placeholder="https://your-publication.com"></div><div class="field"><label for="sample">Or paste a writing sample</label><textarea id="sample" placeholder="Title, author, and article text…"></textarea></div><div class="note">Concept preview: importing would show readable articles, bylines, exclusions, and coverage before proposing a voice. This prototype does not fetch websites.</div><div class="dialog-footer"><button class="textbtn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toast('Import flow previewed. No website fetched or writing analyzed.')">Preview complete ✓</button></div>`)}
function authorDetail(n){modal(`${titleRow(n+'’s voice')}<p class="small muted" style="margin-top:15px">Author subprofile · View From The Pine ${pubs[1].version}</p><div class="note" style="margin-top:18px">Shared publication rules form the foundation. Only supported differences belong here. This concept does not invent traits for a real author.</div><div class="rule"><h4>Evidence needed</h4><p>Verified bylines and representative writing samples.</p></div><button class="btn primary" onclick="importSamples()">Add this author’s writing →</button>`)}
function reviewDraft(){let text=state.output===0?state.pieces[state.current].text:state.outputDrafts[state.current+'-'+state.output];if(!text?.trim()){toast('Add a draft before reviewing it.');return}state.outputStatus[state.output]='Review';if(state.output===0)state.pieces[state.current].status='Review';modal(`${titleRow('Give it an editor’s eye.')}<p class="small muted" style="margin-top:12px">${state.outputs[state.output]} · ${esc(state.pieces[state.current].title)}</p><div class="notice" style="margin-top:20px">Manual review checklist. The prototype has not analyzed the prose or verified its claims.</div>${['The piece sounds like the selected publication.','Factual claims are supported; open gaps are resolved.','Experience and opinions are honestly attributed.'].map((s,i)=>`<label class="checkline"><input class="review-check" type="checkbox" style="width:16px;flex:none;margin-top:3px" onchange="document.getElementById('approve-draft').disabled=document.querySelectorAll('.review-check:checked').length!==3">${s}</label>`).join('')}<div class="dialog-footer"><button class="textbtn" onclick="closeModal();render()">Keep editing</button><button id="approve-draft" class="btn primary" disabled onclick="approveDraft()">Approve this output</button></div>`)}
function approveDraft(){state.outputStatus[state.output]='Ready';if(state.output===0)state.pieces[state.current].status='Ready';closeModal();render();toast('This output is approved. Other outputs still need their own review.');setTimeout(lessonPrompt,400)}
function lessonPrompt(){modal(`${titleRow('Anything worth remembering?')}<p class="small muted" style="margin-top:12px">Turn an editorial decision into a reusable voice preference, only if you want it to apply beyond this piece.</p><div class="field"><label for="lesson">A lesson from your edits</label><textarea id="lesson" placeholder="For example: open reviews with a specific observation before giving the verdict."></textarea></div><div class="note">Applying a lesson creates a new publication profile version. This approved output keeps its current voice selection.</div><div class="dialog-footer"><button class="textbtn" onclick="closeModal()">Just this piece</button><button class="btn primary" onclick="saveLesson()">Save to publication voice</button></div>`)}
function saveLesson(){let t=document.getElementById('lesson').value.trim();if(!t){toast('Write the preference you want to keep.');return}let p=pubs[state.pub];p.rules.push(t);p.version='v'+(Number(p.version.slice(1))+1);closeModal();toast('Confirmed lesson added to a new voice version.')}
function addOutput(){modal(`${titleRow('Give the idea another form.')}<div class="field"><label for="output-name">Output format</label><select id="output-name"><option>Newsletter</option><option>Social post</option><option>Article</option><option>Review</option><option>Video script</option></select></div><div class="note">The new output starts with this publication’s voice and an independent draft.</div><div class="dialog-footer"><button class="textbtn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="state.outputs.push(document.getElementById('output-name').value);state.outputStatus.push('Not started');flow().versions.push(pubs[state.pub].version);flow().rules.push([...pubs[state.pub].rules]);flow().authors.push('Publication voice');closeModal();render()">Add output →</button></div>`)}
function contentInterview(){modal(`${titleRow('Talk through the idea.')}<p class="small muted" style="margin-top:13px">What’s the observation that made you want to write this piece?</p><textarea id="content-answer" aria-label="Your observation" style="margin-top:16px"></textarea><div class="dialog-footer"><button class="textbtn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveContentAnswer()">Add to source notes</button></div>`)}
function saveContentAnswer(){let a=document.getElementById('content-answer').value.trim();if(!a){toast('Add your observation first.');return}let p=state.pieces[state.current];p.sources=(p.sources||'')+'\n\nInterview observation: '+a;closeModal();render();toast('Saved to this piece, without changing the publication voice.')}
function download(name,text){let url=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPiece(){let p=state.pieces[state.current];let t=state.output===0?p.text:state.outputDrafts[state.current+'-'+state.output]||'';download('kessel-run-draft.md',`# ${p.title}\n\nPublication: ${pubs[p.pub].name}\nOutput: ${state.outputs[state.output]}\nStatus: ${state.outputStatus[state.output]}\nVoice: ${flow().versions[state.output]} · ${state.author}\n\n${t}\n\n---\nExported from an interactive mockup. Sample content requires editorial and factual review.\n`);toast('Markdown draft exported.')}
function exportVoice(){let p=pubs[state.pub];download('voice-profile.md',`# ${p.name}\n\nVersion: ${p.version}\nMaturity: ${p.voice}\n\n## Voice preferences\n\n${p.rules.map(r=>'- '+r).join('\n')}\n\n---\nPrototype profile: includes illustrative rules that need validation.\n`)}
function resetDemo(){location.reload()}
function render(){sidebar();document.getElementById('crumb').innerHTML=`Workspace <span style="margin:0 10px;color:#526586">/</span> <strong>${{home:'Overview',library:'All content',publication:pubs[state.pub].name,voices:'Voice studio',piece:'Writing desk'}[state.page]}</strong>`;document.getElementById('app').innerHTML=({home,library,publication,voices,piece:editor}[state.page])()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('dialog')){let els=[...document.querySelectorAll('dialog button:not([disabled]),dialog input,dialog textarea,dialog select')];let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
state.pieces.forEach((_,i)=>{state.current=i;flow()});state.current=0;
render();
