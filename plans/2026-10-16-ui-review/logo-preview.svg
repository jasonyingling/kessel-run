<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">Kessel Run logo concept</title>
  <desc id="desc">A split K mark with a forward-cut arm, shown on dark and light backgrounds and at small sizes.</desc>
  <defs><g id="mark" fill="currentColor"><path d="M4 5h5v22H4z"/><path d="m11 14 10-9h7L16 16l12 11h-7L11 18z"/></g></defs>
  <path fill="#0b1020" d="M0 0h920v240H0z"/>
  <path fill="#f2f4f8" d="M0 240h920v200H0z"/>
  <g font-family="Inter, Geist, Arial, sans-serif">
    <text x="48" y="40" font-size="11" letter-spacing="2" fill="#93a3c3">KESSEL RUN / IDENTITY CONCEPT</text>
    <use href="#mark" transform="translate(44 76) scale(2)" color="#9dbbff"/>
    <text x="130" y="122" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#e7edff">Kessel Run</text>
    <text x="48" y="198" font-size="14" fill="#93a3c3">A clear direction. Room for your voice.</text>
    <use href="#mark" transform="translate(626 72) scale(3.25)" color="#e7edff"/>
    <text x="48" y="278" font-size="11" letter-spacing="2" fill="#53627c">ONE MARK, AT EVERY SIZE</text>
    <g color="#1a2437">
      <use href="#mark" transform="translate(48 310) scale(.5)"/>
      <use href="#mark" transform="translate(130 308) scale(.625)"/>
      <use href="#mark" transform="translate(216 306) scale(.75)"/>
      <use href="#mark" transform="translate(306 304) scale(.875)"/>
      <use href="#mark" transform="translate(400 302)"/>
    </g>
    <g fill="#53627c" font-size="12">
      <text x="48" y="364">16px</text><text x="130" y="364">20px</text><text x="216" y="364">24px</text><text x="306" y="364">28px</text><text x="400" y="364">32px</text>
    </g>
    <use href="#mark" transform="translate(610 302)" color="#1a2437"/>
    <text x="655" y="327" font-size="24" font-weight="600" letter-spacing="-.6" fill="#1a2437">Kessel Run</text>
    <text x="48" y="411" font-size="12" fill="#53627c">Original vector geometry · currentColor · no embedded fonts or raster imagery</text>
